name: Sync Catalog

on:
  schedule:
    # Tiap 6 jam (00:00, 06:00, 12:00, 18:00 UTC = 07:00, 13:00, 19:00, 01:00 WIB)
    - cron: '0 */6 * * *'
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run catalog sync (scrape Elex, m&c!, PGI)
        run: python3 scripts/auto-sync-catalog.py

      - name: Regenerate lightweight listing catalog
        # auto-sync-catalog.py gagal me-regenerate file ini sendiri
        # (import split_catalog tidak ada), jadi dijalankan eksplisit
        run: python3 scripts/split-catalog.py

      - name: Commit & push kalau ada perubahan
        run: |
          git config user.name "Llunatics"
          git config user.email "57332128+Llunatics@users.noreply.github.com"

          # Race-proof: cron sinkron KKI lokal (Sel/Jum 07:08 WIB) bisa push
          # duluan saat run ini jalan (keduanya menulis catalog.json).
          # Kalau remote sudah maju, skip push — scrape ini idempoten,
          # perubahan ikut run 6 jam berikutnya. (Fix 2026-10-13: run
          # 38326059903 gagal push karena race persis seperti ini.)
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Remote main sudah maju duluan (race dengan sinkron KKI) — skip push."
            exit 0
          fi

          git add src/data/catalog.json src/data/catalog-listing.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan katalog — skip commit."
          else
            git commit -m "chore(data): auto-sync katalog $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
